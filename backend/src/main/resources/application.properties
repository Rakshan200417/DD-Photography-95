# Database Configuration
# Cloud MySQL Database (Credentials provided via Render Environment Variables)
# Falls back to H2 database for local development if DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/photography_app;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Spring Boot will automatically detect the driver and dialect based on the JDBC URL
# H2 console enabled for local debugging
spring.h2.console.enabled=true

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Static file uploads
spring.web.resources.static-locations=file:uploads/

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration (Allows your frontend to connect)
app.cors.allowed-origins=http://localhost:3000

# Email Configuration (Optional SMTP for real email delivery)
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# Google OAuth 2.0 Client ID
google.client.id=204064221358-hmhi5i60me9lbl2jet7d3k0f9pb7r8kl.apps.googleusercontent.com