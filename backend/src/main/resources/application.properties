# Database Configuration
# Cloud MySQL Database (Credentials provided via Render Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/photography_app?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

